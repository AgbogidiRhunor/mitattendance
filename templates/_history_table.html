<div class="table-wrap"><table>
  <thead><tr><th>Meeting</th><th>Date</th><th>Status</th></tr></thead>
  <tbody>
  {% for s in sessions %}
    <tr><td>{{ s.title }}</td><td>{{ s.meeting_date|date:"j M Y" }}</td>
        <td>{% if s.present %}<span class="badge badge-strong">Present</span>{% else %}<span class="badge">Absent</span>{% endif %}</td></tr>
  {% empty %}<tr><td colspan="3" class="muted">No finalized meetings yet.</td></tr>{% endfor %}
  </tbody>
</table></div>
