<ul class="list panel">
  {% for s in sessions %}
  <li class="item"><div class="grow"><strong>{{ s.title }}</strong><span class="sub">{{ s.meeting_date|date:"D, j M Y" }}</span></div>
    {% if s.present %}<span class="tag tag-ok"><svg class="icon xs"><use href="#i-check"/></svg>Present</span>{% elif s.status == "scheduled" or s.status == "open" %}<span class="tag">{{ s.get_status_display }}</span>{% else %}<span class="tag">Absent</span>{% endif %}
  {% empty %}<li class="item empty">No finalized meetings yet.</li>{% endfor %}
</ul>
