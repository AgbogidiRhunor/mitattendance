{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn" href="?{{ qs }}{% if qs %}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span class="btn is-disabled">Previous</span>{% endif %}
  <span class="sub">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn" href="?{{ qs }}{% if qs %}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>{% else %}<span class="btn is-disabled">Next</span>{% endif %}
</nav>
{% endif %}
