{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<a class="back" href="{% url 'manage_sessions' %}"><svg class="icon sm"><use href="#i-back"/></svg>Sessions</a>
<div class="page-head"><div><h1>{{ title }}</h1></div></div>
<form method="post" class="panel form form-wide" novalidate>
  {% csrf_token %}
  {% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<p class="error">{{ e }}</p>{% endfor %}</div>{% endfor %}
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save session</button><a class="btn" href="{% url 'manage_sessions' %}">Cancel</a></div>
</form>
{% endblock %}
