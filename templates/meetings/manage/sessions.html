{% extends "base.html" %}{% block title %}Sessions{% endblock %}
{% block content %}
<div class="head-row"><h1>Sessions</h1><a class="btn btn-primary" href="{% url 'manage_session_create' %}">Create session</a></div>
<form method="get" class="filters">
  <label for="status">Status</label>
  <select id="status" name="status"><option value="">All</option>{% for v, l in statuses %}<option value="{{ v }}"{% if v == status %} selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  <button class="btn" type="submit">Filter</button>
</form>
{% include "meetings/manage/_session_table.html" with rows=page_obj.object_list %}
{% include "_pagination.html" %}
{% endblock %}
