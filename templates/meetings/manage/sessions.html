{% extends "base.html" %}{% block title %}Sessions{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Sessions</h1><p class="sub">Create, close and finalize meetings.</p></div>
  <div class="actions"><a class="btn btn-primary" href="{% url 'manage_session_create' %}"><svg class="icon sm"><use href="#i-plus"/></svg>New session</a></div></div>
<form method="get" class="search">
  <label class="sr-only" for="status">Status</label>
  <select id="status" name="status"><option value="">All statuses</option>{% for v, l in statuses %}<option value="{{ v }}"{% if v == status %} selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  <button class="btn" type="submit">Filter</button>
</form>
{% include "meetings/manage/_session_table.html" with rows=page_obj.object_list %}
{% include "_pagination.html" %}
{% endblock %}
